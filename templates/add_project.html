{% extends "base.html" %} {% block content %}
<div class="max-w-md mx-auto bg-white shadow rounded p-6">
  <h1 class="text-2xl font-bold mb-4">Add New Project</h1>
  <form action="/add-project" method="post">
    <label class="block mb-2 text-gray-700" for="repo_full"
      >Repository (owner/repo):</label
    >
    <input
      id="repo_full"
      name="repo_full"
      type="text"
      placeholder="owner/repo"
      class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring focus:border-blue-300"
      required
    />
    <button
      type="submit"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
    >
      Add Project
    </button>
  </form>
</div>
{% endblock %}
