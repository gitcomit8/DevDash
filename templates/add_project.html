{% extends "base.html" %} {% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
  <h1 class="text-2xl font-bold text-primary mb-4">Add New Project</h1>
  <form action="/add-project" method="post" class="space-y-4">
    <label for="repo_full" class="block text-sm text-gray-700"
      >Repository (owner/repo):</label
    >
    <input
      type="text"
      id="repo_full"
      name="repo_full"
      placeholder="owner/repo"
      required
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
    />
    <button
      type="submit"
      class="w-full bg-primary text-white py-2 rounded hover:bg-primary-dark transition text-sm"
    >
      Add Project
    </button>
  </form>
  <a
    href="/dashboard"
    class="block text-center text-primary mt-4 hover:text-primary-dark transition text-sm"
    >&larr; Back to Dashboard</a
  >
</div>
{% endblock %}
