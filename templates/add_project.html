{% extends "base.html" %} {% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Add New Project</h1>
  <form action="/add-project" method="post" class="space-y-6">
    <div>
      <label for="repo_full" class="block text-gray-700 font-medium mb-2"
        >Repository (owner/repo):</label
      >
      <input
        type="text"
        id="repo_full"
        name="repo_full"
        placeholder="owner/repo"
        required
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition duration-300"
    >
      Add Project
    </button>
  </form>
  <div class="mt-6 text-center">
    <a href="/dashboard" class="text-blue-600 hover:text-blue-800 transition"
      >&larr; Back to Dashboard</a
    >
  </div>
</div>
{% endblock %}
