<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | default("DevDash") }}</title>
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <style>
      .fade-in {
        animation: fadeIn 0.5s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans antialiased fade-in">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside class="w-64 bg-white shadow-md">
        <div class="p-4 text-center">
          <h1 class="text-xl font-bold text-primary">DevDash</h1>
        </div>
        <nav class="mt-8">
          <a
            href="/"
            class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-200"
          >
            <!-- Home icon -->
            <div class="w-4 h-4 inline-block">
              <svg
                class="w-full h-full"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6"
                />
              </svg>
            </div>
            <span class="ml-3 text-sm">Home</span>
          </a>
          {% if user %}
          <a
            href="/dashboard"
            class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-200"
          >
            <!-- Dashboard icon -->
            <div class="w-4 h-4 inline-block">
              <svg
                class="w-full h-full"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 10h4v11H3zM13 3h4v18h-4zM21 14h-4v5h4z"
                />
              </svg>
            </div>
            <span class="ml-3 text-sm">Dashboard</span>
          </a>
          <a
            href="/add-project"
            class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-200"
          >
            <!-- Add project icon -->
            <div class="w-4 h-4 inline-block">
              <svg
                class="w-full h-full"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                />
              </svg>
            </div>
            <span class="ml-3 text-sm">Add Project</span>
          </a>
          <a
            href="/logout"
            class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-200"
          >
            <!-- Logout icon -->
            <div class="w-4 h-4 inline-block">
              <svg
                class="w-full h-full"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7"
                />
              </svg>
            </div>
            <span class="ml-3 text-sm">Logout</span>
          </a>
          {% else %}
          <a
            href="/login"
            class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-200"
          >
            <!-- Login icon -->
            <div class="w-4 h-4 inline-block">
              <svg
                class="w-full h-full"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12H3m12 0l-4-4m4 4l-4 4"
                />
              </svg>
            </div>
            <span class="ml-3 text-sm">Login</span>
          </a>
          {% endif %}
        </nav>
      </aside>
      <!-- Main Content Area -->
      <div class="flex-1 overflow-y-auto p-6">
        {% block content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
