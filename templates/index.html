{% extends "base.html" %} {% block content %}
<div class="max-w-3xl mx-auto text-center">
  <h2 class="text-4xl font-bold text-primary mb-4">Welcome to DevDash</h2>
  <p class="text-lg text-secondary mb-8">
    Manage your GitHub projects with a modern, intuitive interface.
  </p>
  {% if not user %}
  <a
    href="/login"
    class="bg-primary text-white py-3 px-6 rounded shadow hover:bg-primary-dark transition"
  >
    Login with GitHub
  </a>
  {% endif %}
</div>
{% endblock %}
